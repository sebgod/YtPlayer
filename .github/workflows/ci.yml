name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DOTNET_NOLOGO: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build (both targets, WebView2 and WebKitGTK)
        run: dotnet build src/YtPlayer -c Release
      - name: Test
        run: dotnet test --project tests/YtPlayer.Tests -c Release
